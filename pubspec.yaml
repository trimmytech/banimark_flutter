name: banimark_flutter
description: Drop-in chat widget and API client for a Banimark AI support desk (self-hosted, Laravel or standalone).
version: 0.2.1
homepage:  https://banimark.com
repository: https://github.com/trimmytech/banimark_flutter
issue_tracker: https://github.com/trimmytech/banimark_flutter/issues


environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # picking a file to attach; everything else (emoji, bubbles) is built in
  file_picker: ^10.3.3
  # opening a tapped link in the device browser (the default onOpenLink)
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
